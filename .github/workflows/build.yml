name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: steaminput-harness-linux-x86_64
            ext: .tar.gz
          - os: windows-latest
            asset: steaminput-harness-windows-x86_64
            ext: .zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libpulse-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          tar czf ../${{ matrix.asset }}.tar.gz steaminput-harness ds5-mic ds5-input
          cd ..
          sha256sum ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path build\Release\steaminput-harness.exe -DestinationPath ${{ matrix.asset }}.zip
          certutil -hashfile ${{ matrix.asset }}.zip SHA256 > ${{ matrix.asset }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}${{ matrix.ext }}*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}${{ matrix.ext }}
            ${{ matrix.asset }}${{ matrix.ext }}.sha256
